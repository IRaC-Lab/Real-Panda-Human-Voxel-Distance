/**:
  ros__parameters:
    # multi mapper
    mapping_type: "human_with_static_tsdf"  # ["human_with_static_tsdf", "human_with_static_occupancy"]
    # lidar settings
    use_lidar: false
    use_segmentation: true
    # Color Overlay is published by the segmentation pipeline, not the nvblox
    # color layer. Skip unused background color integration to free GPU time.
    use_color: true
    integrate_color_rate_hz: 60.0
    update_mesh_rate_hz: 0.0
    publish_debug_vis_rate_hz: 10.0

    static_mapper:
      # Decay stale TSDF voxels wherever the people mask invalidates depth.
      projective_tsdf_integrator_invalid_depth_decay_factor: 0.8

    multi_mapper:
      remove_small_connected_components: true

    dynamic_mapper:
      # occupancy integrator
      projective_integrator_max_integration_distance_m: 5.0
      projective_integrator_truncation_distance_vox: 4.0
      free_region_occupancy_probability: 0.3
      occupied_region_occupancy_probability: 0.9
      unobserved_region_occupancy_probability: 0.35
      occupied_region_half_width_m: 0.2
      # occupancy decay integrator
      free_region_decay_probability: 0.55
      occupied_region_decay_probability: 0.25
