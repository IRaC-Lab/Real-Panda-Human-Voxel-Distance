# use_fake_hardware:=true (mock_components): position commands, no gains.
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    franka_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster

    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

franka_robot_state_broadcaster:
  ros__parameters:
    arm_id: panda

panda_arm_controller:
  ros__parameters:
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.1
      goal: 0.05
